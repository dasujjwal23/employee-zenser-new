spring:
  application:
    name: book
  datasource:
      url: jdbc:mysql://localhost:3306/cognizant?useSSL=false&serverTimezone=UTC
      username: admin
      password: admin
      driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
     hibernate:
         # Options: none, update, create, create-drop, validate
       ddl-auto: update 
     show-sql: true
     properties:
       hibernate:
         dialect: org.hibernate.dialect.MySQLDialect # Use org.hibernate.dialect.MySQL8Dialect for MySQL 8 and above

server:
  port: 8081